<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card 1 Gradient -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card 2 Gradient -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Chip Gold Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Dynamic Shimmer Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="-1; 2" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25">
        <animate attributeName="offset" values="-0.5; 2.5" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0">
        <animate attributeName="offset" values="0; 3" dur="3.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .floating-card-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .floating-card-2 {
        animation: float2 5s ease-in-out infinite alternate;
      }
      .chip-line {
        stroke: #854d0e;
        stroke-width: 1;
      }
      .neon-text {
        fill: #38bdf8;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
      }
      .dash-circle {
        stroke-dasharray: 6 8;
        animation: rotateDash 25s linear infinite;
        transform-origin: 940px 210px;
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.95); }
        100% { opacity: 0.55; transform: scale(1.05); }
      }
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(-6deg); }
        100% { transform: translateY(-14px) rotate(-4deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(8deg); }
        100% { transform: translateY(-16px) rotate(10deg); }
      }
      @keyframes rotateDash {
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="200" cy="80" r="180" fill="#6366f1" opacity="0.18" filter="url(#neonGlow)" class="pulse-circle" />
  <circle cx="1000" cy="320" r="220" fill="#06b6d4" opacity="0.15" filter="url(#neonGlow)" class="pulse-circle" />
  <circle cx="600" cy="400" r="140" fill="#3b82f6" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Left Content Area (Typography & Features) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="16" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED SPEND ECOSYSTEM</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome Corporate Card
    </text>
    <text x="0" y="195" fill="url(#cardGrad2)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      &amp; Spend Platform
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS Leaders, Virtual Card Engines &amp; Open-Source Financial Stacks
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 275)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
        <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">💳 Corporate Cards</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(155, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.85" />
        <text x="14" y="20" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">⚡ Spend Controls</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(320, 0)">
        <rect width="150" height="32" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.85" />
        <text x="14" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🌐 Open-Source</text>
      </g>
    </g>

    <!-- Additional Feature Line -->
    <g transform="translate(0, 335)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">
        🛡️ Real-Time Budgets • 🔄 Auto-Reconciliation • 📊 Multi-Currency Accounting • 🔐 AP Automation
      </text>
    </g>
  </g>

  <!-- Right Visual / Dynamic Card Graphics -->
  <g transform="translate(0, 0)">
    <!-- Rotating Dotted Halo -->
    <circle cx="940" cy="210" r="170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" class="dash-circle" />
    <circle cx="940" cy="210" r="140" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.15" />

    <!-- Background Card (Card 2) -->
    <g class="floating-card-2" transform-origin="930 240" filter="url(#cardShadow)">
      <g transform="translate(800, 140)">
        <rect width="280" height="175" rx="14" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
        <rect width="280" height="175" rx="14" fill="url(#shimmer)" />
        <!-- Card Details -->
        <text x="24" y="40" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="16" letter-spacing="1">EXPENSE PRO</text>
        <text x="220" y="40" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="20">🌐</text>
        <!-- Virtual Card Number -->
        <text x="24" y="115" fill="#e2e8f0" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="15" letter-spacing="2">•••• •••• •••• 8842</text>
        <text x="24" y="145" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">VALID 08/29</text>
        <text x="180" y="145" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">VIRTUAL AP</text>
      </g>
    </g>

    <!-- Foreground Card (Card 1) -->
    <g class="floating-card-1" transform-origin="890 190" filter="url(#cardShadow)">
      <g transform="translate(750, 95)">
        <rect width="290" height="180" rx="15" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
        <rect width="290" height="180" rx="15" fill="url(#shimmer)" />
        
        <!-- Brand / Logo -->
        <text x="26" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="18" letter-spacing="1">CORPORATE</text>
        
        <!-- Contactless Icon -->
        <path d="M 245 28 A 12 12 0 0 1 245 44 M 250 24 A 18 18 0 0 1 250 48 M 255 20 A 24 24 0 0 1 255 52" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />

        <!-- EMV Smart Chip -->
        <g transform="translate(26, 56)">
          <rect width="44" height="32" rx="6" fill="url(#chipGrad)" stroke="#a16207" stroke-width="0.8" />
          <line x1="0" y1="16" x2="44" y2="16" class="chip-line" />
          <line x1="16" y1="0" x2="16" y2="32" class="chip-line" />
          <line x1="28" y1="0" x2="28" y2="32" class="chip-line" />
          <rect x="14" y="9" width="16" height="14" rx="3" fill="none" stroke="#a16207" stroke-width="0.8" />
        </g>

        <!-- Card Number -->
        <text x="26" y="125" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="17" letter-spacing="3">4520 •••• •••• 9012</text>
        
        <!-- Cardholder & Tier -->
        <text x="26" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">ENTERPRISE CARD</text>
        <text x="205" y="152" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800">PLATINUM</text>
      </g>
    </g>
  </g>
</svg>
